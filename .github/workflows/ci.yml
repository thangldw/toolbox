name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: toolbox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.app }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [diskora, changeora]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
      - name: Show Swift version
        run: swift --version
      - name: Lint
        run: swift format lint --recursive --parallel Sources Tests Package.swift
      - name: Unit tests
        run: swift test
      - name: Smoke tests
        run: ./scripts/test_core.sh
      - name: Release build
        run: swift build -c release
      - name: Packaged localization
        run: |
          ./scripts/build_app.sh
          if [[ "${{ matrix.app }}" == "diskora" ]]; then APP_NAME="Diskora"; else APP_NAME="Changeora"; fi
          test -f "dist/$APP_NAME.app/Contents/Resources/en.lproj/Localizable.strings"
          plutil -lint "Resources/en.lproj/Localizable.strings"
          codesign --verify --deep --strict "dist/$APP_NAME.app"
